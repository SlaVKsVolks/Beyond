[package]
rust-version = "1.99.1"
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Repository tasks: cargo run -p xtask -- package BINARY OUTDIR | tokens"

[dependencies]
horizon-theme = { path = "../crates/horizon-theme" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
