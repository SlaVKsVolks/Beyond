[package]
name = "fps-overlay"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Horizon's official FPS counter: frames per second in a corner, with the minimum and the 1% low."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../../crates/horizon-mod-sdk" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
