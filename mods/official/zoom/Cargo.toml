[package]
name = "zoom"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Horizon's official zoom: hold a key to zoom, the wheel changes it while held."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../../crates/horizon-mod-sdk" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
