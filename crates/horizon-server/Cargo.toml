[package]
name = "horizon-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.99.1"
description = "Host a Horizon server: server.toml, the CLI and the supervisor that runs the game headless (docs/server.md)"

[dependencies]
horizon-server-files = { path = "../horizon-server-files" }
# The game process's RAM and CPU (the same probes the benchmark reports use).
horizon-bench = { path = "../horizon-bench" }
# The log's local times, as the game prints them.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Edits server.toml in place, keeping the owner's comments and order.
toml_edit = "0.25"
# Updates: the release from GitHub, checked against the SHA-256 in its signed checksums (both already in the
# lockfile, ureq through horizon-server-files).
horizon-release-sign = { path = "../horizon-release-sign" }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Backups: one zip anyone can open, Windows included.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM/SIGHUP: stop the game cleanly when the terminal or the service manager asks.
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
signal-hook = { version = "=0.3.18", default-features = false }

[target.'cfg(windows)'.dependencies]
win32console = "=0.1.5"
winconsole = "=0.11.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "forbid"

# Preserve the existing inherited policy; the audit rejects workspace-policy drift.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[[test]]
name = "windows_console"
path = "tests/windows_console.rs"
harness = false

[[test]]
name = "unix_signals"
path = "tests/unix_signals.rs"
harness = false
