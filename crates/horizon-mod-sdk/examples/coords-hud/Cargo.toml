[package]
name = "coords-hud"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.99.1"
publish = false
description = "Example Horizon mod: coordinates, facing and the time of day on the HUD, and /where"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../.." }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
