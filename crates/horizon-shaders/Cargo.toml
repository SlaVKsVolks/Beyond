[package]
name = "horizon-shaders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.99.1"
description = "Shader packs (the shaders/ folder format): reading packs, their .properties and .lang files, and later their GLSL"

[dependencies]
horizon-core = { path = "../horizon-core" }
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
