[package]
name = "horizon-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon version-specific model and resource decoding"

[dependencies]
horizon-core = { path = "../horizon-core" }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[dev-dependencies]
png = "0.18"
